# ════════════════════════════════════════════════════════════════════════════
# agents_128k.ini — tuned for llama3.1:8b's full 131072-token (~128K) context
#
# ⚠ READ BEFORE USING ⚠
# llama3.1:8b *supports* 131072 tokens, but supporting it and having the RAM
# for it are different things. Ollama's KV cache for this model costs
# ~128 KiB per token of context (fp16 cache: 32 layers × 8 KV-heads ×
# 128 head_dim × 2 bytes × 2 for K&V). That means:
#
#     num_ctx   |  KV-cache RAM (fp16)   |  + q8_0 KV quant
#     4 096     |  ~0.5 GB               |  ~0.25 GB   (your old default)
#     16 384    |  ~2.0 GB               |  ~1.0 GB
#     32 768    |  ~4.0 GB               |  ~2.0 GB
#     65 536    |  ~8.0 GB               |  ~4.0 GB
#     131 072   |  ~16.0 GB              |  ~8.0 GB    (this file, as requested)
#
# Your machine: 15.7 GB RAM total, ~9-10 GB already in use with the model
# loaded at num_ctx=4096. Setting num_ctx=131072 needs ~16 GB *on top of*
# the model weights (~5 GB) — it will not fit, and Ollama will either fail
# to allocate the KV cache or force Windows into heavy swapping (the agent
# loop will appear to hang for minutes per call, per the documented
# real-world behaviour of this model at 96K+ context on similar 16GB boxes).
#
# This file still does the full math for 131072 as asked, every line below
# is tagged [128K] with the old value, so you can see exactly what changed.
# If you actually run it and it stalls/OOMs, the realistic ceiling on your
# hardware is closer to:
#   num_ctx = 24576-32768   (fp16 KV cache, default Ollama)
#   num_ctx = 49152-65536   (only if you set OLLAMA_FLASH_ATTENTION=1 and
#                            OLLAMA_KV_CACHE_TYPE=q8_0 before `ollama serve`)
# Swap num_ctx below to one of those and the rest of the budgets still work
# fine — they were deliberately left well under the 131072 ceiling (see
# remaining-budget math per section), not maxed out, in case you do.
#
# Token budget breakdown (131072 total, coder path):
#   coder      sys≈494  out=3000  feedback×2≈300  prefetch≈1500
#              reserved≈5294  remaining≈125778 tok (≈503K chars)
#              => file budget set to 60000 chars (≈15000 tok) — large
#                 safety margin kept deliberately, see warning above.
#   architect  sys≈119  out=1536  per_file×6≈3000  overhead≈50
#   gate1      sys≈96   out=128   overhead≈50       => block≈8000 chars (cheap, no change to out)
#   validator  sys≈230  out=500   exec≈100          overhead≈100
#
# NOTE — Jan uses OpenAI-compatible API (api_format = openai).
#   num_ctx is forwarded to Ollama only. If you switch to api_format=openai,
#   set the model context window to 131072 in Jan UI (Settings → Model →
#   Context Length) — same RAM warning above still applies either way.
# ════════════════════════════════════════════════════════════════════════════

# ── active profile ────────────────────────────────────────────────────────────
[api]
active     = remote
verify_ssl = true
# AUTO-JSONMODE-1: GLOBAL switch — asks the endpoint to enforce valid JSON
# at the token-sampling level (OpenAI `response_format: {"type":
# "json_object"}` / Ollama `format: "json"`) instead of relying purely on
# prompt instructions + after-the-fact salvage parsing. Currently used by
# Gate 1 (gate1_filter.py); other callers can adopt the same flag later.
# If the active endpoint rejects the field (HTTP 400), it is logged as a
# LOUD warning, disabled for that endpoint for the rest of the run, and
# every call quietly falls back to today's best-effort parsing — no crash,
# no manual intervention needed.
# If exist error: JSON decode failed (Expecting value: line 1 column 1 (char 0)) — failing closed  raw=
# change from response_format = false -> response_format = true
# [128K] was false — flipped to true. Field report: with it off, a real
# run against openrouter.ai produced repeated "Expecting ',' delimiter" /
# "Invalid control character" JSON errors from evidence strings quoting
# source code with UNESCAPED internal quotes/newlines (e.g. evidence:
# "with path.open("r", ...)" — the embedded "r" quote breaks the JSON
# string boundary). Every one of the 5 escalating retries hit the exact
# same error, at every token budget — this is a grammar/escaping problem,
# not a budget problem, so more tokens/lower temperature never fixed it.
# Engine-level JSON mode constrains the sampler to only emit
# grammatically valid JSON, which structurally can't produce an
# unescaped quote inside a string value — this is the class of bug it
# exists to prevent.
response_format = true
# AUTO-THINKDEPTH-1: GLOBAL switch — when true, forwards a reasoning-depth
# hint alongside an already-enabled `think = true` (per-[section], e.g.
# [gate1] think = true), on top of the existing plain on/off thinking
# toggle. Default false: on/off `think` behaviour is completely unchanged
# unless you opt in here. Has no effect when the calling section's own
# `think` is false/unset — depth only matters once reasoning is on.
# openai-format: rides in the `reasoning.effort` field (OpenRouter-style).
# ollama-format: Ollama's own top-level `think` field, on models that
# support a string depth (e.g. gpt-oss) instead of a plain boolean.
# If the endpoint rejects the depth value (HTTP 400), it's logged as a
# LOUD warning, disabled for that endpoint for the rest of the run, and
# falls back to plain think: true — no crash, no manual intervention.
think_effort_enabled = false
# low | medium | high (or any string the target model recognises).
# Only used when think_effort_enabled = true.
think_effort = medium

[api_local]
# ── Ollama ──
# Start server: ollama serve
# Verify model: ollama list
# num_ctx is forwarded directly to Ollama via options{} — no UI config needed.
base_url   = http://localhost:11434
api_key    = ollama
model      = llama3.1:8b
#qwen3:8b
api_format = ollama
num_ctx    = 131072
# [128K] was 4096. See RAM warning at top of file before using as-is.
# num_ctx has no effect with api_format=openai — configure in Jan UI instead.
# Keep the key so switching to ollama format works without editing this file.
# ── Jan  ──
#base_url   = http://localhost:1337/v1
#api_key    = jan
#model      = qwen3:8b
#api_format = openai


[api_remote]
#base_url   = https://openapi.web.url/v1
# ⚠️  RESTORED-FROM-GENERIC-TEMPLATE: this section had been reset to
# generic placeholder values (api.server.com / qwen2.5-coder:32b) in the
# committed file — restoring the actual provider/model this session was
# using (GLM-5.2 via freerouter.eu.cc). api_key below is STILL a
# placeholder — I (Claude) never had your real key, only a redacted
# example you pasted in chat ("here you are key!!!") — paste your real
# token in before running.
api_key    = <your-real-freerouter.eu.cc-token-here>
model      = glm-5.2
api_format = openai
think      = true

# GLM-5.2 (Z.ai) documents a 1,000,000-token context window — verify
# against whatever model this section currently points at if you swap
# providers again (check the provider's own model page). AUTO-H5-ESCALATE-1
# in architect.py and Gate1Filter's own unparseable-retry escalation both
# cap their token-budget escalation ladder at num_ctx * 0.5 — a stale,
# too-small num_ctx silently caps escalation far below what the CURRENT
# model can actually take, even though nothing errors or warns about it.
num_ctx    = 1000000

# ── loop control ──────────────────────────────────────────────────────────────
[loop]
# Each failed attempt appends ~150-token feedback to the next prompt.
# With 131K window, feedback is a rounding error in the budget — more
# retries are now affordable before they crowd out file content.
max_iterations   = 5
# [128K] was 3.
timeout_seconds  = 4800
# [128K] was 2400. Larger prompts take longer to prefill on CPU — a single
# call near the file-budget ceiling will take noticeably longer than at 4K.

# ── search ────────────────────────────────────────────────────────────────────
[search]
# full_file_max_chars: used by SearchAgent for context-probe symbol lookup.
full_file_max_chars = 12000
# [128K] was 3000 (≈3000 tok now vs ≈750 tok before).
max_depth           = 8
max_file_kb         = 600
# [128K] was 200 — larger context can afford to scan/consider bigger files.
skip_dirs           = __pycache__,.venv,node_modules,.git,dist,build,venv,.tox
max_file_kb_creative = 1000
# [128K] was 400.

# ── architect ─────────────────────────────────────────────────────────────────
[architect]
# AUTO-FIX (fable follow-up): disable qwen3-style <think> reasoning for
# this call -- with a bounded max_tokens, truncation mid-<think> leaves
# strip_think() with nothing usable and the call fails closed/empty.
# Set true to re-enable reasoning if your model/setup needs it.
think                = false
# AUTO-BUG-8: seconds to wait between retries on a transient LLM/HTTP error
# (comma-separated). Default matches the previous hardcoded schedule; lower
# this for a local model that's known to come up fast, or add a longer first
# delay if it commonly needs time to load into memory.
retry_delays_sec     = 5,15,30
# AUTO-H4: after a truncated JSON array (at least one task salvaged from
# an otherwise-cut-off response), re-ask with a smaller max_tasks instead
# of losing the unsalvaged tail task. 0 disables (old behaviour).
# [128K] was 2 — raised to 4 for headroom against this profile's larger
# batches (max_files_per_review below), which produce longer task arrays
# more likely to need more than one shrink step to fit.
truncation_retry_max     = 4
truncation_shrink_factor = 0.5
# AUTO-H5 / AUTO-H5-ESCALATE-1: after a wholly unsalvageable response
# (empty, degenerate repetition, prose instead of JSON, or non-list
# JSON — nothing to salvage at all), retry with escalating max_tokens/
# alternating temperature (AUTO-RETRY-TEMP-1: fixed 0.0/0.1 schedule per
# token tier, not a step down from the base temperature — was a
# same-settings plain retry before AUTO-H5-ESCALATE-1) — a
# reasoning-heavy model (e.g. GLM-5.2) burning the whole budget on
# <think> before writing JSON is the same failure Gate 1's
# presence-check escalation already handles. 0 disables (old behaviour:
# 0 candidates from that batch immediately).
# [128K] was 2, then 5 — raised to 6 (an even multiple of the 2-entry
# temperature schedule) so the ladder reaches its 16384/32768 rungs AND
# every rung it reaches gets both temperatures tried, not just the
# first; each extra retry costs one more full LLM round trip (several
# seconds) on a batch that's still failing, so this is a real
# latency/cost tradeoff, not free.
empty_response_retry_max = 6
# AUTO-CR-18: cap creative tasks per cluster (small models emit many
# overlapping 'synchronize' tasks that collapse chapters into copies).
max_tasks_creative   = 5
# [128K] was 1 (4K preset). Kept at 5 — this cap is a model-quality limit,
# not a context-budget limit; 128K context does not justify more overlap.
temperature          = 0.2
# AUTO-H5-ESCALATE-1 note: this is the budget for the FIRST, unescalated
# attempt — the escalation ladder in architect.py only kicks in AFTER
# this attempt comes back empty/unsalvageable, starting from its own
# floor (4096, doubling per retry). A base max_tokens smaller than that
# floor (was 1536 here) guarantees the first attempt fails on any
# reasoning-heavy model before escalation ever gets a chance to help —
# every batch pays for 2-3 failed round trips (confirmed live: 9-50s
# each) before finally succeeding at a higher escalated budget it could
# have started at. [128K] was 512, then 1536 — raised to 16384 (the
# budget a real run actually needed to succeed on this preset's default
# model) so most batches succeed on the FIRST try instead of burning
# through several retries first. Lower this back down for a
# non-reasoning / smaller model where 1536-4096 is genuinely plenty and
# the extra headroom is pure waste.
max_tokens           = 16384
# [128K] was 512, then 1536.
max_tokens_creative  = 3072
# [128K] was 1024.
max_file_chars       = 12000
# [128K] was 1500 (≈3000 tok/file now vs ≈500 tok before).
max_files_per_review = 6
# [128K] was 3 — budget now supports reviewing twice as many files at once.
rewrite_max_tokens   = 768
# [128K] was 256.
rewrite_temperature  = 0.4
rewrite_system = You are a senior architect reviewing failed implementation attempts. Your job is to propose a genuinely different technical strategy for the same goal. Study what was tried before and what went wrong. Do not suggest the same approach with minor changes — if the previous attempt used direct string manipulation, consider AST parsing. If it used a class, consider a function. If it modified state in place, consider returning a new object. Identify the core assumption that caused the previous approach to fail and start from a different assumption. Return only JSON.

# AUTO-CR-20: plan-validator (check architect plan vs goal facts before Gate-1)
validate_plan_creative = true   ; enable plan validation in creative mode
plan_max_revisions     = 1      ; bounded re-runs; fail-open after cap

# ── AUTO-P: architect context probe ───────────────────────────────────────────
# Lets the Architect reply "ARCH_PROBE: facts <symbol>" instead of the JSON task
# array when it cannot ground a task without a fact it was not shown. The
# harness resolves the lookup against the collect artifact, appends a digest and
# re-asks; when the budget is spent it forces one final "plan with what you
# have" call. See README.md → "AUTO-P — the context probe".
#
# ON by default? No — every shipped profile, including this one, ships with
# probe_enabled = false (AC-P3M-2, enforced by
# tests/test_auto_p3_profile_matrix.py — no profile may ship it on). What
# makes this profile different is not a different default here, it's
# [collect] use_in_auto = true below: this is the only profile with a live
# collect artifact, so it's the only one where flipping probe_enabled ON AT
# RUNTIME (locally, uncommitted) doesn't trip the no-collect lint trap.
# Turning probe_enabled on without a real collect artifact elsewhere produces
# probes that resolve nothing and fall straight through to the forced call —
# the startup lint warns about exactly that on every OTHER profile.
#
# AUTO-P4c/AUTO-P13 correction: the comment used to claim this profile
# "deliberately does NOT pin" probe_max_rounds / probe_max_chars /
# probe_max_total_chars / probe_allowed_ops and is "left to the harness's
# own fallback defaults" — that was never true of the values actually
# committed below (they ARE pinned), and it left this whole block
# under-scaled: [api] active = remote below points at [api_remote]
# (GLM-5.2, num_ctx = 1 000 000), not the top-of-file local llama3.1 128K
# math, yet probe_max_chars/probe_max_total_chars were only ~2x the
# harness's small-context fallback (2000/6000) while every OTHER budget in
# this file (coder file budget, architect max_tokens, gate1 block size...)
# was scaled up 5-30x for this profile. AUTO-P11's own window budget
# (num_ctx minus the file-review prompt and reply, ~2.6M chars here) has
# always had far more room than these caps used — the probe just never
# asked for it.
#
# Measured with this OFF-by-default value flipped to true locally, never
# committed (trace_8c83140453d5): 216 probe request(s), 433/517 op(s)
# resolved. Flip it the same way — locally, at runtime — to reproduce; do
# not commit it true here, or AC-P3M-2's own test will fail on this profile.
#
# NOTE: delete .agent/architect_checkpoint.json whenever you flip probe_enabled.
# A cached batch result is replayed with no LLM call at all, so a run measured
# against a stale checkpoint shows a probe that never fires.
probe_enabled         = false
# Probe rounds per batch before the forced final call. [128K] was 3 — a live
# run against this profile's actual (remote, 1M-token) endpoint needed 5 and
# hit that cap mid-batch, contradicting the old "never needed more than 3"
# comment this replaces. Raised with headroom above the observed figure
# rather than pinned exactly to it.
probe_max_rounds      = 6
# Cap on one op's result (hard truncation, with a visible notice).
# [128K] was 4000 — see the AUTO-P13 note above on why the old caps here
# were never actually scaled for this profile's real window.
probe_max_chars       = 20000
# Cap on the accumulated digest PER BATCH — reset between batches (AUTO-P4a).
# [128K] was 12000, ~3x smaller than [coder] max_file_chars for a SINGLE
# file in this same profile. 60000 matches [coder]'s own file budget below
# as a saner order of magnitude for a 1M-token active window.
probe_max_total_chars = 60000
# Comma-separated allow-list. Three ops have executors: `facts <symbol>`
# (one symbol's signature and contracts), `module <path>` (a file's
# top-level symbol inventory — AUTO-P5) and `read <path>:<a>-<b>` (actual
# source lines from the working tree — AUTO-P7). An unrecognised op parses to nothing, i.e.
# degrades to "not a probe". Present but empty means "allow nothing" and fails
# closed — it does not restore the default.
probe_allowed_ops     = facts, module, read
# AUTO-F1: a `facts` name that has already come back empty this run is
# answered from a memo instead of costing another bridge lookup — bounded
# here so a pathological run cannot grow it without limit. 0 disables the
# memo (every repeat looks up fresh, pre-AUTO-F1 behaviour). Measured:
# trace_8c83140453d5 served 40 of 105 `facts` asks from this memo (0 bridge
# calls), 71% of that run's 56 misses.
probe_memo_max_entries = 200
# AUTO-P8: escalated re-asks when the digest cap cuts a round short. The cap
# became the binding constraint once `module` and `read` landed — 15 of 23
# declines in a measured run were budget exhaustion, and the ops it dropped
# were dropped silently. Each step is one extra architect call; the ladder is
# (2x cap, temp 0), (same cap, temp 0.7), (4x cap, temp 0). 0 disables it.
# [128K] was 2 of the 3 available rungs — raised to 3 (the ladder's own
# length; higher is clamped down to this by architect.py) so a batch that
# genuinely needs the full climb gets to, instead of being forced out one
# rung short.
probe_budget_escalations = 3
# AUTO-P13: multiplies each ladder rung's cap-factor before it's applied —
# 1.0 (the default everywhere else) reproduces AUTO-P8/AUTO-P9's ladder
# exactly. This profile's active endpoint is a 1M-token remote model (see
# the AUTO-P4c/AUTO-P13 note above [api_remote].num_ctx), so a single 2x
# rung off a 60000-char base is still a rounding error against the real
# window — 3.0 lets one rung reach for meaningfully more room instead of
# spending an extra architect round-trip to slowly rediscover it.
# AUTO-P11's _clamp_to_window still bounds the result either way.
probe_budget_ladder_scale = 3.0
# AUTO-P9: learn the working digest cap instead of rediscovering it once per
# batch. A measured run climbed the AUTO-P8 ladder 57 times across 63 probing
# batches — one extra architect call per rung — because the configured cap sat
# right on the median round cost (10 000 vs a measured 9 582). After
# probe_budget_warmup complete rounds the cap is reseeded to
# median x probe_budget_headroom, bounded by probe_budget_max_chars.
# Replaying that run: headroom 2.0 removes ~42 of the 57 escalations.
# probe_budget_warmup = 0 disables learning.
probe_budget_warmup      = 3
probe_budget_headroom    = 2.0
# Hard ceiling on the learned cap. 0 = four times probe_max_total_chars, so a
# pathological run cannot learn its way to an unbounded prompt.
probe_budget_max_chars   = 0

# ── gate1 false-positive filter ───────────────────────────────────────────────
[gate1]
temperature      = 0.0
# 512 tokens: if [api_local] model is switched to a thinking model (e.g.
# qwen3:8b, commented out above), its <think> block eats part of this
# budget before the JSON verdict — 128 was enough to truncate it entirely
# and fail every candidate closed. think=false disables that reasoning for
# this call regardless of which model is active.
max_tokens       = 512
think            = false
max_context_lines = 150
# [128K] was 25 — can show far more surrounding code for the same check.
max_block_chars  = 8000
# ⚠️  RESTORED-FROM-GENERIC-TEMPLATE: this had been re-commented in the
# committed file. Uncommented — [gate1_llm] below is your real
# second-model setup (bynara.id/deepseek), not the generic placeholder
# section it had reverted to.
# presence_llm_profile = gate1_llm   ; allow override model for check in gate1

[gate1_llm]
base_url    = https://second.openapi.web.url/v1
# ⚠️  api_key below is STILL a placeholder — I (Claude) never had your
# real key, only a redacted example you pasted in chat ("key") — paste
# your real token in before running.
api_key     = <your-real-second.id-token-here>
model       = deepseek-v4-pro-free
api_format  = openai
think       = true      ; independed by gate1 think = false
temperature = 0.0
max_tokens  = 32768
num_ctx     = 512000


# ── coder ─────────────────────────────────────────────────────────────────────
[coder]
# AUTO-FIX (fable follow-up): disable qwen3-style <think> reasoning for
# this call -- with a bounded max_tokens, truncation mid-<think> leaves
# strip_think() with nothing usable and the call fails closed/empty.
# Set true to re-enable reasoning if your model/setup needs it.
think                = false
# AUTO-CR-18: reject an edit that makes a chapter >= this similar to another
# chapter (prevents 'make identical' from duplicating whole chapters). 0 disables.
dup_reject_ratio     = 0.92
temperature  = 0.2
max_tokens   = 3000
# [128K] was 800 — bigger window can justify generating larger functions/files
# in one pass, though this is still far short of maxing the window (see
# header math: ~125K tok remain after this + system + feedback + prefetch).
max_file_chars      = 60000
# [128K] was 2000. Deliberately kept well under the ~503K-char remaining
# budget (see header) as a safety margin, not maxed — see top-of-file warning
# about why pushing this further is a bad idea on your hardware anyway.
context_probe       = true
max_chars_per_dep   = 1500
# [128K] was 400.
max_dep_chars       = 6000
# [128K] was 1200.
#
# AUTO-CR-3: creative-mode budget overrides for llama3.1:8b.
# [128K] num_ctx_creative REMOVED — it was 8192, which is now *smaller* than
# the new base num_ctx (131072) and would silently shrink creative-mode
# context instead of expanding it. If you keep this key, remove or raise it;
# leaving it unset means creative mode now correctly uses the full base
# num_ctx above.
creative_language   = auto
max_tokens_creative = 6000
# [128K] was 2048.

# ── inner_loop / validator ────────────────────────────────────────────────────
[inner_loop]
temperature = 0.1

[validator_agent]
# AUTO-FIX (fable follow-up): disable qwen3-style <think> reasoning for
# this call -- with a bounded max_tokens, truncation mid-<think> leaves
# strip_think() with nothing usable and the call fails closed/empty.
# Set true to re-enable reasoning if your model/setup needs it.
think                = false
temperature = 0.1
max_tokens  = 900
# AUTO-FIX-6: raised from 500 — 500 was sized for the short
# code-mode JSON reply ({"approved": bool, "feedback": "..."}). With
# AUTO-FIX-4 restoring the built-in numbered-list creative critique
# (_GATE2_SYSTEM_CREATIVE, several Russian bullet points — Cyrillic runs
# ~2x the tokens of English for the same text, see header note above), the
# old 500-token cap risked truncating the list mid-critique. Code-mode
# JSON replies stay well under this new cap; this is headroom, not a
# behaviour change for code mode.
# [128K] was 200 — more room for detailed feedback text.
max_hints   = 4
# [128K] was 2 — cheap to allow more hints now that output budget isn't tight.
system = You are a code-change validator. Given a task description, execution output, and the generated code, decide whether the implementation is complete and correct. Return ONLY a JSON object -- no text before or after: {"approved": true|false, "feedback": "<one sentence reason>", "hints": ["<actionable hint 1>", ...], "suggested_approach": "<optional one-sentence alternative>", "missing_context": ["<symbol you needed to see but were not shown>", ...]}. Use missing_context ONLY when you cannot verify correctness because a referenced symbol's definition was not provided; otherwise omit it. Each hint MUST point to a specific name, line, or pattern in the code (e.g. "import re is used on line 12 but not present in imports"), never a vague instruction like "make sure the code is correct". Omit the hints array (or use []) when approved=true.
# AUTO-CR-19-1: explicit creative override so this is config-visible and the
# bare "system" key above (code-specific) cannot leak into creative mode.
# AUTO-FIX-4: system_creative override REMOVED — it was a stale one-line
# verdict prompt that silently overrode the built-in _GATE2_SYSTEM_CREATIVE
# (numbered multi-point critique, anti-paste rule; see inner_loop.py CR-29/32).
# _resolve_validator_system() gives an explicit [validator_agent] system_creative
# key priority over the built-in for ANY task_mode, so as long as this key was
# set here, every creative run used the old one-line prompt regardless of what
# improved in inner_loop.py. Leave unset to use the built-in; only set this key
# again for a deliberate, reviewed override.
# AUTO-CR-20: Gate-3 task-level fact compliance (creative mode only)
fact_check_creative = true
max_fact_revisions  = 3      ; was 2 — hallucinated numbers need more than one correction pass
# AUTO-CR-21: Russian rhythm/rhyme gate (creative mode only)
prosody_check_creative      = true   ; deterministic ритм/рифм gate
max_prosody_revisions       = 2      ; bounded; fail-open after cap
# AUTO-CR-24-1: verify story-bible facts against the source chapter before merge
story_bible_creative           = true   ; AUTO-CR-23: enable the durable-fact story bible
story_bible_max_chars          = 2000   ; AUTO-CR-23: bible size cap before compaction
story_bible_verify              = true   ; AUTO-CR-24: verify bible facts vs the chapter
story_bible_max_fidelity_rounds = 2   ; was 1 — one more pass to fix distortions (AUTO-CR-25-3)
story_bible_immutable_guard = true   ; AUTO-CR-26: write-once for gender/age
prosody_min_scheme          = ABCB   ; ABCB(loosest)|ABAB|AABB
prosody_syllable_tolerance  = 2
# AUTO-CR-23-3: continuity gate vs story bible + previous chapter (creative mode only)
continuity_check_creative = true   ; checks new chapter against bible + prev chapter
max_continuity_revisions  = 3      ; was 2 — same reasoning as max_fact_revisions above

validator_llm_profile = critic_llm
# Enable critic llm external model for check

[critic_llm]

base_url = https://ur-other-critic-model
api_key = model
model = step-3-7-flash:free
think       = true      ; опционально — думающий критик при недумающем дефолте
temperature = 0.1
max_tokens  = 9000
num_ctx     = 65536
api_format  = openai
verify_ssl  = true




# ── ContextBroker ─────────────────────────────────────────────────────────────
[context_broker]
max_block_chars = 2000
# [128K] was 400.
max_symbols     = 6
# [128K] was 3.

# ── auto pipeline ─────────────────────────────────────────────────────────────
# [128K] Left intentionally unchanged: these are iteration-COUNT controls
# (how many rewrite/compression/fidelity passes run), not token budgets.
# More context makes each individual call cheaper to afford, but doesn't by
# itself justify more passes — raise rewrite_every_n_rounds / max_rewrites /
# max_compression_passes manually only if you actually want longer pipelines.
[auto]
git_user            = auto-agent
git_email           = auto-agent@localhost
max_runtime_min     = 0
max_tasks_per_run   = 0
exec_timeout_sec    = 120
# Max number of per-task .agent/workspace/<task_id>/ full-repo mirrors kept
# on disk at once (oldest pruned first). Without a bound, every task
# (AUTO-T1, AUTO-T2, ...) plus AUTO-G5 regression re-checks each leave a
# full copy of the repo behind, filling the disk on long runs. 0 disables
# pruning (old behaviour).
workspace_retain_count = 5
rewrite_every_n_rounds = 2
max_rewrites        = 3
task_mode           = creative
# [128K] was code (4K preset). Matches 32K preset — larger context makes
# creative-mode the practical default where full chapters fit comfortably.
creative_acceptance_default = true
max_compression_passes      = 2
max_fidelity_rounds         = 2
canon_check_every           = 3
max_canon_revisions         = 2      ; was 1 — canon was accepting at-cap after a single try
# AUTO-CR-16: creative gets more coder→review→revise cycles than code,
# so editing existing chapters and applying review fixes has room to retry.
max_attempts_per_task          = 5
max_attempts_per_task_creative = 12  ; was 8 — round 1 exhausted on wall-clock at attempt 6, not the cap
# AUTO-CR-21-4: hard per-task wall-clock guard (independent safety valve);
# 0 disables. Prevents pathological tasks (e.g. the 3-hour rhythm/rhyme
# runaway) from looping for hours.
max_task_seconds               = 3600  ; was 1800 — round 1 hit this before exhausting its attempts
canon_max_claims            = 12

# ── other agents ──────────────────────────────────────────────────────────────
[chat]
use_context  = true
new_chat_key = /new
exit_key     = /exit

[main_agent]
temperature       = 0.3
system_delegate   = You are the Chief Architecture Routing Agent. Your task is to look at incoming natural language coding inputs, identify target components, coordinate dependency assembly contexts, and assign downstream validation paths. Maintain clean state arrays.
system_assemble   = You are the Context Assembly Agent. Aggregate structural files, import tokens, and reference blocks into a single complete code bundle. Ensure no duplicate declarations enter the token payload.

[direct_chat]
temperature = 0.3

[search_agent]
temperature = 0.2
system      = You are an engineering-grade reference analyzer. Examine the attached source code snippets and filter out noise such as standard library wrappers (e.g., generic logging calls, standard os/sys wrappers, or boilerplate imports). Retain and approve only local, custom domain logic components crucial for dependency resolution.

[file_editor]
temperature = 0.2
max_tokens  = 2000
# [128K] was 512 — same rationale as [coder] max_tokens.
# prev_context_every = N
#   Show the writer its previous attempt (alongside feedback) for N consecutive
#   retries, then force one "clean" iteration (feedback only) to break loops,
#   then repeat the window.
prev_context_every = 2
prev_context_max_chars = 60000
# [128K] was 2000 — matches [coder] max_file_chars so a full previous
# attempt can be shown without truncation.

[improvement_agent]
temperature = 0.4
max_tokens  = 2000
# [128K] was 1000 — reviews of bigger files (now allowed in) naturally run longer.
system_improve = You are a senior code reviewer. Analyze the validated code context, identify security vulnerabilities, logical flaws, edge cases, and performance bottlenecks. You MUST return your output following this exact layout strictly:\n\n    EXPLANATION:\n    <what this code does in 2-3 sentences>\n\n    ISSUES:\n    - <issue 1>\n    - <issue 2>\n\n    IMPROVED CODE:\n    <full improved function or class block here>\n\n    CHANGES:\n    - <change 1>\n    - <change 2>
system_explain = You are a code explainer. Break down the provided code block's architectural mechanics, interactions, execution sequence, and API dependencies clearly. Provide structural insights without generating any code changes or diff files.

[output]
stream_agents        = true
show_context_lines   = true
show_timing          = true
show_iteration_count = true

[prompt_store]
max_versions = 3
store_path   = prompts.json

[prompt_optimizer]
enabled                = true
temperature            = 0.4
trigger_avg_iterations = 2.0
trigger_json_fail_rate = 0.30
min_runs_before_optimize = 5

[trace]
enabled              = true
path                 = agent_trace.jsonl
max_field_chars      = 12000
# [128K] was 4000 — captures fuller prompts/responses in the trace log now
# that they're allowed to be bigger.
console_echo         = true
console_preview_chars = 300

# ── faq / knowledge-base resolver ─────────────────────────────────────────────
[faq_agent]
knowledge_dir    = ./knowledge
extensions       = .txt,.md
temperature      = 0.0
max_tokens       = 1536
# [128K] was 1024 — modest bump, answer length doesn't need to scale with
# context the way file budgets do.
not_found_marker = NOT FOUND
system = You are a help-desk FAQ resolver. Answer the user's question using ONLY the content of the knowledge files provided below. The knowledge files and the question may be written in DIFFERENT languages — understand the content by meaning regardless of language, and write your answer in the language of the user's question. Quote or paraphrase the relevant answer text. If NONE of the files contain a suitable answer, reply with exactly: NOT FOUND
#
smart_search         = true
keyword_system       = You are a search keyword extractor. Given a user question, extract 3-8 important search keywords. Return ONLY a JSON array of lowercase strings, for example: ["reset","password","account"]. No explanation, no markdown fences, no other text.
keyword_max_tokens   = 64
max_candidates       = 15
# [128K] was 5 — each Stage-1 single-file call now has far more headroom,
# so trying more candidate files individually before falling back to
# Stage 2 (send-all) is cheap.
#
validate_answer      = true
validate_temperature = 0.0
validate_max_tokens  = 64
validate_system = You are an answer quality validator for a help-desk FAQ system. You are given a user question, the knowledge-base content that was searched, and a candidate answer produced from that content. The question, knowledge, and answer may be in different languages — judge by MEANING, not language; a correct translation of the knowledge is VALID. Reply with exactly VALID if the answer correctly and completely addresses the question using only the provided knowledge. Reply with INVALID: <brief reason> if the answer is wrong, hallucinated, incomplete, or not grounded in the knowledge base. No other output — VALID or INVALID: <reason> only.

# ── grounding / intent revalidation ──────────────────────────────────────────
revalidate_grounding = true
# revalidate_grounding_system = ...

# ── collect mode (COLLECT-19/20) ──────────────────────────────────────────────
# Entire section is optional. Absent section = identical to every default
# below, i.e. today's behavior: /collect and --collect still work (producer
# side is always available), but nothing reads a collect artifact into
# auto/doc/bughunt unless use_in_* is explicitly turned on.
[collect]
# enabled: master switch for the producer (/collect, --collect/--check/
# --refresh/--module). false = every collect action except --check is a
# documented no-op; --check still just reports freshness either way.
enabled         = true
max_tokens = 4096
# dir: where the structural model is written. Relative paths resolve
# against the project root. collect can never write outside this dir.
dir             = .collect
# use_in_*: opt-in consumer-side wiring (COLLECT-21/23). Each stays false
# until the corresponding EPIC G loader integration lands, so turning
# these on ahead of that is a no-op today, not a broken build.
# AUTO-P3M-6: this is the one profile where use_in_auto is ON — it's the
# operator's live profile with an actual .collect artifact on disk, which is
# what [architect] probe_enabled above needs to resolve anything. See
# AUTO-P-RUNBOOK.md — flipping this on for any other profile is a doc change,
# not just a config change, since no other profile has a matching artifact.
use_in_auto     = true
use_in_doc      = false
use_in_bughunt  = false
# staleness: what a consumer does when the artifact is older than the
# tracked source tree. warn = use stale data + flag it; refresh = rebuild
# before reading; ignore = treat exactly like "no artifact". Anything
# else falls back to warn.
# COLLECT-24: for --auto specifically, "warn" and "stale" both end up
# behaving like "ignore" from the task's point of view — CollectBridge only
# ever consults a FRESH model, so a stale artifact still logs the warning
# below but falls straight back to standard --auto for the affected
# file/function, with no LLM staleness check of any kind. Run --collect
# --refresh yourself when you want the fresh data used again.
staleness       = warn
# max_context_chars_auto: COLLECT-24 per-task budget for the collect block
# injected into a coder prompt. A block over this size triggers one LLM
# shrink call (via the same Pass B summarizer model below) before falling
# back to hard truncation if that call fails or overshoots.
max_context_chars_auto = 1200
# llm_summaries: whether Pass B (per-module LLM purpose/notes) runs at
# all. false = --no-llm-equivalent: purely structural artifact, no model
# calls, no [collect] think below applies.
llm_summaries   = true
# think: qwen3-style reasoning tag on Pass B's summarizer calls, same
# convention as [story_bible]/[summary_memory] think= above.
think           = false
# max_retries: outer per-module retry count (fixed 1/2/4/8… backoff
# schedule, tools.backoff) before a module is kept structural-only. Was
# previously hardcoded to 3 regardless of this file.
max_retries          = 3
# error_retries / error_retry_wait_sec / max_retry_after_sec: inner
# per-HTTP-request retry on 429/5xx (tools.llm_stream.request_completion).
# error_retries is how many extra attempts after the first; on 429 the
# server's own Retry-After (if any) is used instead of error_retry_wait_sec.
# A requested wait longer than max_retry_after_sec is treated as a
# daily/monthly quota reset and raised immediately instead of blocking.
# These were previously hardcoded (2 / 60 / 180) and ignored this file.
error_retries        = 2
error_retry_wait_sec = 60
max_retry_after_sec  = 180
# languages: comma-separated list of languages Pass A scans (COLLECT-28,
# EPIC H). "python" only, by default — Java support (tree-sitter-java)
# stays fully opt-in even when the optional dependency is installed and
# .java files exist in the tree; add "java" explicitly to turn it on:
#   languages = python,java
languages       = python
# java_extensions: which file extensions count as Java once "java" is in
# languages above. Almost nobody needs to change this; it exists for an
# unusual per-project convention (a generated-sources extension, ...)
# without a code change.
java_extensions = .java

# ─────────────────────────────────────────────────────────────────────────────
# GATES-2: Gate-3 gate order, per task mode
# ─────────────────────────────────────────────────────────────────────────────
# Keys are task modes; values are a comma-separated, ORDERED list of gate
# names. Known gates: canon, fact, continuity, delta, existence, theme, prosody.
#
#   - Section or key ABSENT  -> registry default (all creative gates, in the
#                               order declared in tools/auto/gate_registry.py).
#                               This is the pre-GATES-2 behaviour, so leaving
#                               this section commented out changes nothing.
#   - Key present but EMPTY  -> no gates at all. Useful when benchmarking the
#                               validators themselves, where the gates are the
#                               subject of measurement rather than a filter.
#   - Unknown name           -> logged and skipped, never fatal.
#
# Order matters: the first gate to reject an attempt is the one whose feedback
# the coder sees, and later gates don't run for that attempt.
#
# COST NOTE: every enabled gate is a separate LLM round trip carrying the full
# chapter text, on EVERY attempt. On a small-context profile that is the
# dominant cost of a creative run, and the gates themselves judge worse when
# the text barely fits. Trimming the list is the lever for that -- see the
# per-profile suggestion below. Caps are tuned separately via
# max_<gate>_revisions in the sections above.
#
# [gates]
# creative = canon, fact, continuity, theme, prosody
# code     =

# ─────────────────────────────────────────────────────────────────────────────
# GATES-3: the `existence` gate (docs mode)
# ─────────────────────────────────────────────────────────────────────────────
# Rejects documentation that references files the repository does not contain,
# and documentation that tells the reader to run a test suite when there are no
# test files. Deterministic — it reads the filesystem and makes NO LLM call, so
# it costs nothing per attempt.
#
# It is ON BY DEFAULT in docs mode (it is the registry default for that mode);
# no [gates] line is needed to get it. To turn it off:
#
#   [validator_agent]
#   existence_check = false
#
# Other keys, all optional, all in [validator_agent]:
#   max_existence_revisions   = 2      ; rejections before accepting at cap
#   existence_check_test_suite = true  ; catch `pytest` / `unittest discover`
#   existence_extensions      = py, md, txt, ...   ; what counts as a path
#   existence_ignore          = setup.py, requirements.txt, ...
#
# To run it in another mode, or alongside other gates, name it in [gates]:
#
#   [gates]
#   docs = existence

# ─────────────────────────────────────────────────────────────────────────────
# GATE2-PROFILE-1: a separate model for the Gate-2 critic
# ─────────────────────────────────────────────────────────────────────────────
# The critic is a different job from the author, and wanting a different model
# for it is normal — a cheap fast model writes while a stronger one judges, or
# the reverse. Until this key existed the critic silently reused
# [api_{active}], so when that provider returned HTTP 429 on the critique call
# there was no way to move just the critique elsewhere.
#
# Mirrors [gate1] presence_llm_profile exactly.
#
#   [validator_agent]
#   validator_llm_profile = critic_llm
#
#   [critic_llm]
#   base_url  = https://provider.example/v1   ; REQUIRED
#   api_key   = ...                           ; REQUIRED
#   model     = ...                           ; REQUIRED
#   api_format  = openai      ; optional
#   verify_ssl  = true        ; optional
#   think       = false       ; optional — a thinking critic alongside a
#   temperature = 0.1         ;            non-thinking default is fine
#   max_tokens  = 900         ; optional
#   num_ctx     = 65536       ; optional
#
# base_url/api_key/model are REQUIRED and never inherited: sending one
# provider's credential to another provider's URL is a worse failure than a
# loud stop at startup. Every optional key falls back to what [validator_agent]
# and [api_{active}] already resolved — never to a hardcoded default, and never
# to another profile's value.

# ─────────────────────────────────────────────────────────────────────────────
# GATE3-PROFILE-2/3: per-validator LLM profiles (Gate-3 gates, summary, plan)
# ─────────────────────────────────────────────────────────────────────────────
# Same idea as GATE2-PROFILE-1 above, extended past the single Gate-2 critic:
# every creative-mode validator that makes its own LLM call can now be
# pointed at its own provider/model instead of always sharing whatever
# [api_{active}] (or [validator_agent] validator_llm_profile) already
# resolves to. Until these keys existed, canon / fact / continuity / theme,
# SummaryMemory, and the architect's plan validator all silently reused the
# same shared call, so a rate limit or a "cheap model writes, strong model
# judges" split on just one of them was impossible without moving everything.
#
# Resolution order for the four [validator_agent] keys below — the same
# chain GATE2-PROFILE-1's validator_llm_profile already participates in:
#
#     <gate>_llm_profile  ->  validator_llm_profile  ->  [api_{active}]
#
# An unset <gate>_llm_profile falls back to whatever [validator_agent]
# validator_llm_profile already resolved to, so an operator who already
# moved all judging to one provider does not have to repeat it five times.
# [summary] llm_profile and [architect] plan_llm_profile each run once per
# task rather than once per attempt and have no validator_llm_profile-style
# middle step of their own — unset, they fall straight back to
# [api_{active}].
#
#   [validator_agent]
#   canon_llm_profile      = strong_llm   ; e.g. a stronger model judges canon
#   fact_llm_profile       = strong_llm
#   continuity_llm_profile = cheap_llm
#   theme_llm_profile      =              ; empty = unset, same as absent
#   # prosody has no LLM-backed check (pure syllable/rhyme arithmetic) —
#   # there is no prosody_llm_profile key to set.
#
#   [summary]
#   llm_profile = cheap_llm
#
#   [architect]
#   plan_llm_profile = strong_llm
#
#   [strong_llm]
#   base_url   = https://provider-a.example/v1   ; REQUIRED
#   api_key    = ...                              ; REQUIRED
#   model      = ...                              ; REQUIRED
#   think      = true                             ; optional
#   max_tokens = 2000                             ; optional
#
#   [cheap_llm]
#   base_url = https://provider-b.example/v1      ; REQUIRED
#   api_key  = ...                                 ; REQUIRED
#   model    = ...                                 ; REQUIRED
#
# base_url/api_key/model are REQUIRED and never inherited, for every profile
# named above — sending one provider's credential to another provider's URL
# is a worse failure than a loud stop at startup. Every other optional key
# falls back to whatever the next step in that profile's own chain already
# resolved — never to a hardcoded default, and never to another profile's
# value. A named profile that is missing, or missing a required option,
# raises at construction — before any task runs — never mid-run.

# For runbook's 4 scenrio
[task4_provider_b]
base_url = https://your-second-provider.example/v1
api_key  = your-second-provider-key
model    = your-second-provider-model
