# RUN-10: a pytest run under examples/ is a run in a project of its own.
#
# The runbook's sandboxes (examples/task<N>/hello-world, made by scripts/run_flows.sh)
# and examples/hello-world sit inside this repository. pytest looks for its config
# upwards from the test path, so a run in a sandbox — the executor's acceptance
# check in .agent/workspace/<task>/, check_runbook's "test suite passes" — found the
# repository's own pytest.ini and loaded the repository's conftest.py: the repository
# root became the rootdir, its `-n auto` started eight workers for one test file, and
# its sys.path bootstrap put the repository root first, so `from main import main`
# in a sandbox test imported the pipeline's main.py (an interactive shell that waits
# for input) instead of the sandbox's. A checkout of hello-world on its own has none
# of that; the search stops here, and a sandbox is tested with pytest's defaults.
#
# Keep it empty: anything set here applies to every sandbox and to no real target.
[pytest]
