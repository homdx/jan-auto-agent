# hello-creative — mechanical base: creative
#
# Prose parsing, no acceptance criteria required, Gate 1 Stage B skipped.
# The Gate-3 set is trimmed to the two gates that matter for a changelog:
# canon (the program prints "Hello world" and that must not drift) and
# continuity (entries must not contradict each other). theme and prosody
# are dropped — this is a changelog, not a poem, and each gate is a full
# LLM round trip per attempt.
[skill]
name        = hello-creative
source      = hello-creative/SKILL.md
base        = creative
min_num_ctx = 16384
budget_fraction = 0.25
on_overflow = error

[skill.inject]
architect = body
coder     = body

[skill.overlay]
auto.max_tasks_per_run = 2

[gates]
creative = canon, continuity
