# hello-docs — mechanical base: docs
#
# Prose output, but still grounded in the real source. Gate 1's presence
# check stays on (docs mode keeps code mechanics for grounding), so a task
# claiming a flag that does not exist gets rejected before the coder runs.
[skill]
name        = hello-docs
source      = hello-docs/SKILL.md
base        = docs
min_num_ctx = 16384
budget_fraction = 0.25
on_overflow = error

[skill.inject]
architect = body
coder     = body

[skill.overlay]
auto.max_tasks_per_run = 2
# Gate-3 `fact` is what catches documentation that describes things the
# source does not contain. Observed live: a docs run happily wrote
# "run the tests with python -m unittest test_main.py" into README.md for a
# repository that has no test file at all. Gate 1 did not catch it and could
# not — Gate 1 judges the PLANNED task, not the prose the coder produced.
# The factory is behind this flag, so listing the gate below is not enough
# on its own; without it make_fact_validator returns None and the gate is
# silently absent.
validator_agent.fact_check_creative = true
validator_agent.max_fact_revisions = 2

# Gate-3 for the docs flow. `fact` only — canon/continuity/theme/prosody are
# about a narrative running across chapters, which documentation is not.
[gates]
docs = fact
