# hello-docs — mechanical base: docs
#
# Prose output, but still grounded in the real source. Gate 1's presence
# check stays on (docs mode keeps code mechanics for grounding), so a task
# claiming a flag that does not exist gets rejected before the coder runs.
[skill]
name        = hello-docs
source      = hello-docs/SKILL.md
base        = docs
min_num_ctx = 16384
budget_fraction = 0.25
on_overflow = error

[skill.inject]
architect = body
coder     = body

[skill.overlay]
auto.max_tasks_per_run = 2

# GATES-3: `existence` replaces the `fact` gate that was tried here first.
# `fact` compares the text against facts stated in the TASK, so it has no
# file list and approved "run `python -m unittest discover`" for a repo with
# no tests — twice. `existence` checks the filesystem instead, deterministically
# and without an LLM call.
validator_agent.max_existence_revisions = 2

# Gate-3 for the docs flow. `existence` is also the registry default for docs
# mode, so this line is documentation rather than necessity — but it keeps the
# adapter self-describing, and it is where you would trim the list.
[gates]
docs = existence
