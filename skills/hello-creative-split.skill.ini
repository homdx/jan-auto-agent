# hello-creative-split — GATE3-PROFILE-5: same skill as hello-creative, but
# canon and continuity are pointed at a SECOND LLM profile via
# [validator_agent] canon_llm_profile / continuity_llm_profile
# (GATE3-PROFILE-2). This is task 4 in scripts/run_flows.sh: it exists to
# prove the per-validator profile keys work end to end — not only in unit
# tests — by actually running the author on one provider and the judges on
# another. See examples/hello-world/RUNBOOK.md "Flow 4" for how to configure
# the second provider and how to read the console log for proof.
#
# [task4_provider_b] itself is NOT defined here: a skill adapter is prompt
# material plus a config overlay, committed to the repo, and must never
# carry real credentials. The operator adds a [task4_provider_b] section to
# their OWN (uncommitted) config before running this flow. An absent or
# incomplete section fails loudly at construction — before any task
# runs — exactly like any other misconfigured *_llm_profile
# (GATE3-PROFILE-1/2); it is not this file's job to soften that.
[skill]
name        = hello-creative-split
source      = hello-creative/SKILL.md
base        = creative
min_num_ctx = 16384
budget_fraction = 0.25
on_overflow = error

[skill.inject]
architect = body
coder     = body

[skill.overlay]
auto.max_tasks_per_run = 2
validator_agent.canon_llm_profile      = task4_provider_b
validator_agent.continuity_llm_profile = task4_provider_b

[gates]
creative = canon, continuity
