# hello-code — mechanical base: code
#
# Grounded code review of a tiny script. Uses the stock code mechanics
# (fenced-block parsing, acceptance criteria required, Gate 1 presence
# check active) and only replaces the prompts and the token caps.
[skill]
name        = hello-code
source      = hello-code/SKILL.md
base        = code
min_num_ctx = 16384
budget_fraction = 0.25
on_overflow = error

[skill.inject]
architect = body
coder     = body

[skill.overlay]
auto.max_tasks_per_run = 3
