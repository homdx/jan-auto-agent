[pytest]
addopts = -n auto -q --dist=loadgroup
# pip install pytest-xdist
# --dist=loadgroup: required for @pytest.mark.xdist_group(...) to have any
# effect (see "port_bound_http_servers" in tests/test_llm_stream_*.py etc.)
# -- plain "-n auto" alone uses --dist=load, which ignores xdist_group
# entirely and scatters same-group tests across workers. Confirmed via
# instrumentation: without this flag, tests carrying the SAME
# xdist_group("port_bound_http_servers") mark were scheduled onto every
# worker rather than one. Those tests bind real 127.0.0.1 ephemeral-port
# HTTP servers, so scattering them let genuinely concurrent worker
# processes race for OS-level TCP ports -- the actual cause of
# test_ollama_endpoint_remembered_after_400's "multi-processor only,
# never standalone" flakiness.

# pip install pytest-xdist
