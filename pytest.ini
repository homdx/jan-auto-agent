[pytest]
addopts = -n auto --dist=loadgroup
# FL-7: no `-q` here. Everyone who runs this suite by hand — people and the
# contest's agents alike — types `pytest … -q`, and an ini `-q` on top of that
# is `-qq`, under which pytest prints no `N passed` line at all. In round 74
# two agents re-ran the full suite three and four times (2-3 min each) looking
# for a result that was never printed, and both ran out of their hour.
# pip install pytest-xdist
# --dist=loadgroup: required for @pytest.mark.xdist_group(...) to have any
# effect (see "port_bound_http_servers" in tests/test_contest_cli.py etc.)
# -- plain "-n auto" alone uses --dist=load, which ignores xdist_group
# entirely and scatters same-group tests across workers. Confirmed via
# instrumentation: without this flag, tests carrying the SAME
# xdist_group("port_bound_http_servers") mark were scheduled onto every
# worker rather than one. That group is for the tests that start `kilo
# serve` on a port kilo_client._free_port picked and let go of: two such
# spawns on two workers can be handed the same port. A server bound on
# port 0 inside the test's own process needs no group -- the kernel never
# hands one port to two live sockets (KC-9, test_contest_runner.py).

# pip install pytest-xdist
