# ════════════════════════════════════════════════════════════════════════════
# contest.ini — the Kilo model contest: the roster, the limits, the gate model
#
# Read by tools/contest/roster.py's load_roster(), which hands the runner
# (KC-6) the limits and the policy (KC-3) the session rules. Everything below
# a value's ";" is a comment, as in agents.ini.
#
# Three kinds of section:
#   [contest]               — the round's limits and paths, one set per round
#   [contest_gate_llm]      — the LLM profile the safety gate calls; an
#                              LlmSettings section in the same shape as this
#                              repo's [gate1_llm] in agents.ini
#   [contest.agent.<name>]  — one per competing model, in roster order
#
# Secrets never live here. Put a real api_key in contest.local.ini next to
# this file — git-ignored, read right after this one, so it overrides the
# ${CONTEST_GATE_API_KEY} reference below. ${ENV} references in any value are
# expanded from the environment; an unresolved one is an error naming the key.
#
# Unknown keys in [contest] or in an agent section are an error naming them,
# so a typo is found at load time and not at the end of a round. Unknown
# sections are ignored, so agents.ini can be passed as an overlay.
#
# The three probe models are the default roster: docs/kilo-contest/PROBE.md
# verified kenary/laguna-s-2-1:free, kenary/mistral-medium-3-5:free and
# kenary/hy3:free live on Kilo 7.6.2. `model` is providerID/modelID exactly
# as `kilo models` prints it — split at the FIRST "/", so
# kilo/~anthropic/claude-haiku-latest is provider `kilo`.
# ════════════════════════════════════════════════════════════════════════════

[contest]
# The kilo binary: `auto` = the newest VS Code extension copy, else a path.
kilo_bin                     = auto
# `spawn` = start `kilo serve` on a free port, else http://127.0.0.1:PORT to attach to.
server                       = spawn
# Sessions running at once — one worktree and one session per agent.
max_parallel                 = 3
# Rework prompts per agent after the first turn.
max_rework                   = 2
# One prompt -> session.idle, in seconds.
turn_timeout_sec             = 1800
# No event at all on the stream for this long -> abort the session.
idle_event_timeout_sec       = 300
# Questions a model may ask in one turn; more are rejected.
max_questions_per_turn       = 3
# Where the runner is allowed to put scratch files, comma-separated globs.
tmp_roots                    = /tmp/kilo/*, /tmp/contest/*
# Bash commands a policy denies outright, one per session rule, comma-separated.
deny_commands                = git push*, sudo *, rm -rf /*, curl * | sh, wget * | sh
# The gate's LLM profile: an LlmSettings section name, as [gate1] presence_llm_profile.
gate_llm_profile             = contest_gate_llm
# Gate calls per session; the gate is the expensive second model, not the agent.
gate_max_calls_per_session   = 20
# Where a round's output goes.
out_dir                      = contest-out
# Where a round's harvest lands, relative to this file.
rounds_dir                   = ../rounds

# ── the safety gate's model ──────────────────────────────────────────────────
# LlmSettings fields, resolved by tools.auto.llm_profile.resolve_llm_profile:
# base_url / api_key / model are required and never inherited, every other
# field falls back to the gate defaults (response_format = true).
[contest_gate_llm]
base_url        = https://example/v1
api_key         = ${CONTEST_GATE_API_KEY}   ; env reference — the real key goes in contest.local.ini
model           = some/model
api_format      = openai
response_format = true
temperature     = 0.0
max_tokens      = 256

# ── the roster ───────────────────────────────────────────────────────────────
# One section per competing model, in the order a round runs them. `model` is
# required; `kilo_agent` and `variant` are optional and empty by default,
# which is the server's own default agent (the probe never sent one).
[contest.agent.laguna]
model      = kenary/laguna-s-2-1:free
kilo_agent =
variant    =

[contest.agent.mistral]
model      = kenary/mistral-medium-3-5:free
kilo_agent =
variant    =

[contest.agent.hy3]
model      = kenary/hy3:free
kilo_agent =
variant    =
