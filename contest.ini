# ════════════════════════════════════════════════════════════════════════════
# contest.ini — the Kilo model contest: the roster, the limits, the gate model
#
# Read by tools/contest/roster.py's load_roster(), which hands the runner
# (KC-6) the limits and the policy (KC-3) the session rules. Everything below
# a value's ";" is a comment, as in agents.ini.
#
# Three kinds of section:
#   [contest]               — the round's limits and paths, one set per round
#   [contest_gate_llm]      — the LLM profile the safety gate calls; an
#                              LlmSettings section in the same shape as this
#                              repo's [gate1_llm] in agents.ini
#   [contest_openrouter_llm]— the OpenRouter agents' own profile, read only
#                              when `backend = openrouter`; the competing
#                              agents' credential, not the gate's
#   [contest.agent.<name>]  — one per competing model, in roster order
#
# Secrets never live here. Put a real api_key in contest.local.ini next to
# this file — git-ignored, read right after this one, so it overrides the
# ${CONTEST_GATE_API_KEY} reference below. ${ENV} references in any value are
# expanded from the environment; an unresolved one is an error naming the key.
#
# Unknown keys in [contest] or in an agent section are an error naming them,
# so a typo is found at load time and not at the end of a round. Unknown
# sections are ignored, so agents.ini can be passed as an overlay.
#
# The three probe models are the default roster: docs/kilo-contest/PROBE.md
# verified kenary/laguna-s-2-1:free, kenary/mistral-medium-3-5:free and
# kenary/hy3:free live on Kilo 7.6.2. `model` is providerID/modelID exactly
# as `kilo models` prints it — split at the FIRST "/", so
# kilo/~anthropic/claude-haiku-latest is provider `kilo`.
# ════════════════════════════════════════════════════════════════════════════

[contest]
# The kilo binary: `auto` = the newest VS Code extension copy, else a path.
kilo_bin                     = auto
# `spawn` = start `kilo serve` on a free port, else http://127.0.0.1:PORT to attach to.
server                       = spawn
# Where the agents run: `kilo` (default) talks to `kilo serve`, `openrouter`
# drives each agent through an OpenAI-compatible endpoint in a subprocess.
# One value for the whole round; `--backend` overrides it for one command.
backend                      = kilo
# Sessions running at once — one worktree and one session per agent.
max_parallel                 = 3
# Rework prompts per agent after the first turn.
max_rework                   = 2
# KC-43: legs per round. A ticket too large for one turn runs as numbered legs
# (65.1, 65.2, ...): each leg is a whole turn on a NEW session in the SAME
# worktree, and is handed a short record of what the legs before it left. An
# agent whose leg ends READY is not run again. Intermediate legs are neither
# judged against the bench nor exported; the last leg exports as a round does.
# 1 = one turn, no leg suffix on contest-out/<NN>, the tree before this key.
# `run --legs N` overrides it for one command.
legs                         = 1
# KC-44: the legs a ticket's own `**Size:**` line gets its round, keyed by the
# size upper-cased. `run` reads the ticket's header and runs
# legs_by_size[SIZE] legs when no `--legs` was passed; an entry a size has no
# match in (or no key at all) falls back to `legs` above. A ticket whose size
# is L and whose count comes out to 1 is refused at intake unless `--legs 1`
# says it out loud. The default below changes nothing for the sizes the epic
# actually runs: only L gets a relay.
legs_by_size                 = XS=1, S=1, M=1, L=3
# A turn that ends idle with edits but no commit is nudged on this many times per
# attempt before it is harvested; 0 = off.
max_continues_per_attempt    = 2
# KC-39: how many sessions one attempt may use in all — the first one and every
# replacement. A continue whose diff is byte-for-byte the previous continue's, on
# the last continue of the budget above, goes on in a fresh session instead of
# being harvested in the one that produced the loop; the overflow and context
# swaps (KC-54, KC-69) count against the same ceiling. Per attempt, not per run:
# a rework starts a new attempt and the allowance comes back with it. 0 = off,
# 1 = no reset at all.
max_sessions_per_attempt     = 2
# KC-42: seconds from a turn's prompt in which the worktree must show a sign of
# life — a modified file or a commit. Round 64: three of eight agents finished
# the round with a worktree byte-identical to the base, one of them busy and
# useless for 22 minutes inside a single `task` call, so neither the silence
# clock nor the turn clock ever fired. A third of turn_timeout_sec, and measured
# on the worktree rather than on event traffic: a provider in an
# offline/retry loop looks exactly like an agent at work. Past it the agent is
# nudged first_touch_nudges times, then reset into a fresh session (KC-39's
# escape hatch, subject to the same max_sessions_per_attempt), and failing that
# ends DEAD — never harvested, and reported apart from the stalls. The clock is
# disarmed for the rest of the turn the first time anything is touched.
# 0 = off: the tree before this ticket, byte for byte.
first_touch_sec              = 420
first_touch_nudges           = 1
# One prompt -> session.idle, in seconds. 3600, not 1800: on a loaded box one
# `pytest tests` run inside the turn takes 10-15 min on its own (KC-47).
# KC-36: this is a FLOOR, not a limit — a turn whose worktree is still
# changing is extended by turn_extend_sec at every deadline it reaches, up to
# turn_max_sec. It is the silence clock below that actually catches a dead
# agent: a session that went quiet is aborted by it whatever this says.
turn_timeout_sec             = 3600
# KC-36: seconds granted per extension, when the worktree's churn (files
# touched, lines changed) has grown since the last deadline. 0 = today's clock:
# a turn that reaches turn_timeout_sec is aborted, no callback asked.
turn_extend_sec              = 600
# KC-36: the hard ceiling for one turn, whatever the churn — turn_timeout_sec
# plus every extension stops here, so a model in an infinite edit loop is
# bounded. Must be >= turn_timeout_sec.
turn_max_sec                 = 7200
# No event at all on the stream for this long -> abort the session. 900, not
# 300: a running `bash` (the agent's own pytest) sends no event until it ends,
# and under load that is 300-900 s (KC-47, round 86). A dead stream is caught
# 10 min later than before.
idle_event_timeout_sec       = 900
# Questions a model may ask in one turn; more are rejected.
max_questions_per_turn       = 3
# Retryable session errors in a row: a turn that ends with an answer resets the
# count; one more after N retries ends the agent ERROR "after N retries".
max_error_retries             = 30
# Base backoff between retries, doubled on each retry up to the cap below.
error_retry_backoff_sec       = 15
# The longest wait between two retries: 15, 30, then 60 s apart (30 retries
# = ~29 min in all). 0 = no cap, the wait keeps doubling.
error_retry_max_backoff_sec   = 60
# KC-75: an empty reply (no text, no tool call) in a turn where the provider
# answered 4xx/5xx (Kilo's retry: 429 rate limit, 502, 503) is sent a continue again this many times in a row, 15, 30, 60, 120, 120… s apart,
# before one of max_continues_per_attempt is spent. Any real reply resets it.
max_silent_retries            = 8
silent_retry_max_backoff_sec  = 120
# One agent's hard limit from its start: turns, retries and extensions all fit
# inside it. At the limit the session is aborted, the agent ends STALLED "time
# up", and its tree is scored as it stands. 0 = no limit.
agent_max_sec                 = 5400
# KC-62: Kilo's own store errors ("Failed to execute statement"): retried in the
# same session with their own budget, backoff doubled and jittered ±30 %.
max_local_store_retries       = 5
local_store_retry_backoff_sec = 10
neighbour_kilo_warn           = 4
# KC-64: a provider that fails this many retries in a row, with no model output
# in between, ends the agent ERROR provider_unavailable (round 106: bynara
# retried 51 times over 60 min). 0 = off.
provider_retry_max_attempts   = 10
# KC-61: a provider retry scheduled further out than this is a quota, not a blip:
# the agent ends ERROR provider_quota at once. 0 = off (wait for the silence clock).
provider_retry_max_wait_sec   = 300
# KC-61: quota phrases, |-separated, case-insensitive literals. Used when Kilo
# gives no retry time, and for a session.error. Transient texts must not be here.
quota_patterns                = daily limit | limit reached | quota | insufficient_quota | RESOURCE_EXHAUSTED | free-models-per-day | exceeded your current quota | insufficient credits | would exceed your available credits | top up | billing
# A heartbeat line on stderr every N seconds: who is in which state, for how long. 0 = off.
progress_every_sec           = 60
# KC-57: the wall-clock budget one harvest's pytest roots share. Past it the
# running pytest is ended as a process group and the harvest is REWORK with
# tests_slow, naming the budget and where the time went. 0 = off, unbounded.
harvest_budget_sec           = 900
# KC-41: a turn that ends STALLED/ERROR with a dirty worktree and nothing
# committed gets the work committed for it ("WIP (deadline commit, <reason>)"),
# one PROGRESS.csv row written naming that sha, and the ordinary harvest — so a
# turn killed by the clock is scored on what is on disk instead of becoming a
# zero. true = on (default). false = the pre-KC-41 path byte for byte: no
# commit, no row, no harvest, and export_patches writes the .diff instead.
deadline_commit              = true
# KC-58: whole pytest roots (an agent's own `pytest tests -n 4`, and the harvest)
# that run at once, round-wide; the rest wait, FIFO, with their permission held.
# 0 = off: every reply at once. A holder past agent_suite_max_sec stops blocking
# the next waiter; its pytest is not killed.
agent_suite_slots            = 1
agent_suite_max_sec          = 900
# KC-65: pytest-xdist workers each agent gets; 0 = by live agents (below),
# re-read by every pytest through <out_dir>/pytest-workers.
pytest_workers_per_agent     = 0
# Up to this many live agents each get pytest_workers_few; one alone gets every core.
pytest_workers_few_agents    = 4
pytest_workers_few           = 4
# More live agents than that: this many each. Below 2 a full suite runs over half an hour.
# KC-68: with agent_suite_slots > 0 the auto count is at least the cores split
# between the roots that can run at once (8 cores, 2 slots -> 4 each).
pytest_workers_min           = 2
# Temp dir for the agents' commands (a tmpfs is best); empty = inherit TMPDIR.
agent_tmpdir                 =
# Where the runner is allowed to put scratch files, comma-separated globs.
# KC-59: each agent gets <root>/<agent>/ inside, created at round start and
# named in its prompt; the other agents' dirs are forbidden for it.
tmp_roots                    = /tmp/kilo/*, /tmp/contest/*
# Bash commands a policy denies outright, one per session rule, comma-separated.
deny_commands                = git push*, sudo *, rm -rf /*, curl * | sh, wget * | sh
# Bash commands that may write outside the worktree without a path argument
# (redirects, tee, cp/mv/ln/rsync/dd targets, installers). One ask per pattern.
ask_commands                 = *>*, *|*tee *, cp *, mv *, ln *, rsync *, install *, dd *
# The gate's LLM profile: an LlmSettings section name, as [gate1] presence_llm_profile.
gate_llm_profile             = contest_gate_llm
# The OpenRouter agents' own profile, read only when backend = openrouter.
openrouter_llm_profile       = contest_openrouter_llm
# KC-79: the model `contest draft` writes a ticket with. Fail-open for `run`:
# a broken profile here only stops `draft`, which names the key.
draft_llm_profile            = contest_draft_llm
# KC-79: characters of each collect map (MODULE/TEST/RISK) in the draft prompt.
draft_map_budget             = 8000
# Gate calls per session; the gate is the expensive second model, not the agent.
gate_max_calls_per_session   = 20
# KC-55: a gate call that hits a rate limit or a dropped connection is retried
# (429, 402, 5xx, timeouts, connection errors — never 400/401/403/404).
# KC-66: four retries of 30 s - five tries in all. The gate's key is shared
# with the agents, and three waits of 10 s rejected the action while the key was
# still cooling. Every wait is granted back to the turn, so the agent never pays
# for the gate's 429.
# The wait is the server's Retry-After on a 429, else gate_retry_wait_sec.
# A Retry-After longer than gate_retry_max_wait_sec is a quota reset: no wait,
# the call fails at once. 0 retries = today's fail-fast gate.
# gate_deadline_sec caps one whole gate decision: every retry and re-ask.
gate_retries                 = 4
gate_retry_wait_sec          = 30
gate_retry_max_wait_sec      = 60
gate_deadline_sec            = 600
# Where a round's output goes.
out_dir                      = contest-out
# Where a round's harvest lands, relative to this file.
rounds_dir                   = ../rounds
# KC-59: how each agent's checkout is built. `clone` (the default) is a fresh
# local clone per agent — its own refs/stash, index, HEAD, branches and config,
# so one agent's `git stash` can never pop another agent's work off the stack
# the repo's worktrees share — and its push URL is cut, so `git push` fails in
# git itself. `worktree` is the pre-KC-59 behaviour.
workspace_kind               = clone
# KC-49: the reasoning variant of every agent that names none. `highest` (the
# default) asks each model that lists variants to `say: hello` at intake, from
# the top of the list down, and runs it at the first one that answers; a name
# (`high`, `max`) is sent as is; `default` sends none — the provider's own.
variant                      = highest
# KC-70: a named variant (`high`, `max`, …) that answered intake's `say: hello`
# is not asked again for probe_memory_hours; the file keeps one line per
# provider/model@variant and drops every line past the age. Empty = <out_dir>/probe-memory.json.
probe_memory_file            =
probe_memory_hours           = 24
# KC-70: intake's probes asked at once, and at most this many per provider.
probe_parallel               = 8
probe_per_provider           = 3
# KC-70: a probe refused for a passing reason — a timeout, a 429, an empty
# reply — is asked again this many times, after probe_retry_wait_sec × n
# (twice that after a rate limit). A quota, a login or a rejected request is not.
probe_retries                = 2
probe_retry_wait_sec         = 15
# KC-67: the context overflows the models have already given, remembered for
# context_memory_days so the next session of such a model compacts before it
# overflows again. A file shared by every round; empty = <out_dir>/../context-memory.json.
context_memory_file          =
# KC-67: how many days an overflow is remembered. 0 = no memory, every round
# overflows again the same way.
context_memory_days          = 7
# KC-67: the fill, as a percent of the remembered size, at which the runner
# compacts a session whose model has no limit of its own — Kilo compacts the
# models it does know. 0 = no compact by the runner.
compact_at_percent           = 80
# KC-40: the fill, as a percent of a known size, at which the runner asks a
# session that already holds an uncommitted diff to write a short summary of it
# in chat, and copies the reply out to <out_dir>/<agent>.summary.md — before the
# compact that shrinks the history explaining the diff. One ask per session, and
# only of a dirty tree: a clean one is compacted by KC-10 as today. 90, above
# compact_at_percent on purpose — at these numbers the ask only fires of a
# session the compact would take anyway, and the summary is what goes out first
# of the two. Lower it below compact_at_percent to ask earlier, of a session the
# compact has not reached yet. 0 = no summary.
summary_at_percent           = 90
# KC-10: the window the runner assumes for a model the provider declares no
# limit.context for, after Kilo's own limit and the size KC-67 remembered out
# of the model's last overflow. The fill divides the last reply's input plus
# cache.read by it, so such a model is compacted at compact_at_percent of it.
# 0 = off, every prompt of such a model goes out unsized (KC-67's memory still
# sizes it after its first overflow). Off by default: the models without a
# limit today are ~250k windows (round 49: agnes and mimo at 220-284k), and a
# guess of 32768 would compact them every ~26k tokens. Set it for a roster of
# small (32k) free tiers.
context_limit_fallback       = 0

# ── the safety gate's model ──────────────────────────────────────────────────
# LlmSettings fields, resolved by tools.auto.llm_profile.resolve_llm_profile:
# base_url / api_key / model are required and never inherited, every other
# field falls back to the gate defaults (response_format = true).
[contest_gate_llm]
base_url        = https://example/v1
api_key         = ${CONTEST_GATE_API_KEY}   ; env reference — the real key goes in contest.local.ini
model           = some/model
api_format      = openai
response_format = true
temperature     = 0.0
max_tokens      = 2048          ; a reasoning gate thinks first: 256 came back empty (round 46)

# ── the ticket drafter's model (KC-79) ──────────────────────────────────────
# `python3 -m tools.contest draft --target REPO "brief"`. Same rules as the
# gate's section; the answer is a Markdown ticket, so no JSON response_format.
# The real url, model and key go in contest.local.ini.
[contest_draft_llm]
base_url        = https://example/v1
api_key         = ${CONTEST_DRAFT_API_KEY}  ; env reference — the real key goes in contest.local.ini
model           = some/model
api_format      = openai
response_format = false
temperature     = 0.3
max_tokens      = 4096

# ── the OpenRouter agents' model ─────────────────────────────────────────────
# Read only when backend = openrouter, resolved the same way as the gate's:
# base_url / api_key / model are required and never inherited. The real key
# goes in contest.local.ini. `model` is deliberately empty — each agent gets
# its own model id from its [contest.agent.<name>] section, not from here.
[contest_openrouter_llm]
base_url        = https://openrouter.ai/api/v1
api_key         = ${CONTEST_OPENROUTER_API_KEY}   ; env reference — the real key goes in contest.local.ini
model           =                                 ; unused: per-agent from the roster
api_format      = openai
response_format = false
temperature     = 0.2
max_tokens      = 4096

# ── the roster ───────────────────────────────────────────────────────────────
# One section per competing model, in the order a round runs them. `model` is
# required; `kilo_agent` and `variant` are optional and empty by default,
# which is the server's own default agent (the probe never sent one).
[contest.agent.laguna]
model      = kenary/laguna-s-2-1:free
kilo_agent =
variant    =

[contest.agent.mistral]
model      = kenary/mistral-medium-3-5:free
kilo_agent =
variant    =

[contest.agent.hy3]
model      = kenary/hy3:free
kilo_agent =
variant    =
