# ════════════════════════════════════════════════════════════════════════════
# contest.ini — the Kilo model contest: the roster, the limits, the gate model
#
# Read by tools/contest/roster.py's load_roster(), which hands the runner
# (KC-6) the limits and the policy (KC-3) the session rules. Everything below
# a value's ";" is a comment, as in agents.ini.
#
# Three kinds of section:
#   [contest]               — the round's limits and paths, one set per round
#   [contest_gate_llm]      — the LLM profile the safety gate calls; an
#                              LlmSettings section in the same shape as this
#                              repo's [gate1_llm] in agents.ini
#   [contest_openrouter_llm]— the OpenRouter agents' own profile, read only
#                              when `backend = openrouter`; the competing
#                              agents' credential, not the gate's
#   [contest.agent.<name>]  — one per competing model, in roster order
#
# Secrets never live here. Put a real api_key in contest.local.ini next to
# this file — git-ignored, read right after this one, so it overrides the
# ${CONTEST_GATE_API_KEY} reference below. ${ENV} references in any value are
# expanded from the environment; an unresolved one is an error naming the key.
#
# Unknown keys in [contest] or in an agent section are an error naming them,
# so a typo is found at load time and not at the end of a round. Unknown
# sections are ignored, so agents.ini can be passed as an overlay.
#
# The three probe models are the default roster: docs/kilo-contest/PROBE.md
# verified kenary/laguna-s-2-1:free, kenary/mistral-medium-3-5:free and
# kenary/hy3:free live on Kilo 7.6.2. `model` is providerID/modelID exactly
# as `kilo models` prints it — split at the FIRST "/", so
# kilo/~anthropic/claude-haiku-latest is provider `kilo`.
# ════════════════════════════════════════════════════════════════════════════

[contest]
# The kilo binary: `auto` = the newest VS Code extension copy, else a path.
kilo_bin                     = auto
# `spawn` = start `kilo serve` on a free port, else http://127.0.0.1:PORT to attach to.
server                       = spawn
# Where the agents run: `kilo` (default) talks to `kilo serve`, `openrouter`
# drives each agent through an OpenAI-compatible endpoint in a subprocess.
# One value for the whole round; `--backend` overrides it for one command.
backend                      = kilo
# Sessions running at once — one worktree and one session per agent.
max_parallel                 = 3
# Rework prompts per agent after the first turn.
max_rework                   = 2
# A turn that ends idle with edits but no commit is nudged on this many times per
# attempt before it is harvested; 0 = off.
max_continues_per_attempt    = 2
# One prompt -> session.idle, in seconds. 3600, not 1800: on a loaded box one
# `pytest tests` run inside the turn takes 10-15 min on its own (KC-47).
# KC-36: this is a FLOOR, not a limit — a turn whose worktree is still
# changing is extended by turn_extend_sec at every deadline it reaches, up to
# turn_max_sec. It is the silence clock below that actually catches a dead
# agent: a session that went quiet is aborted by it whatever this says.
turn_timeout_sec             = 3600
# KC-36: seconds granted per extension, when the worktree's churn (files
# touched, lines changed) has grown since the last deadline. 0 = today's clock:
# a turn that reaches turn_timeout_sec is aborted, no callback asked.
turn_extend_sec              = 600
# KC-36: the hard ceiling for one turn, whatever the churn — turn_timeout_sec
# plus every extension stops here, so a model in an infinite edit loop is
# bounded. Must be >= turn_timeout_sec.
turn_max_sec                 = 7200
# No event at all on the stream for this long -> abort the session. 900, not
# 300: a running `bash` (the agent's own pytest) sends no event until it ends,
# and under load that is 300-900 s (KC-47, round 86). A dead stream is caught
# 10 min later than before.
idle_event_timeout_sec       = 900
# Questions a model may ask in one turn; more are rejected.
max_questions_per_turn       = 3
# Retryable session errors: how many times to retry before giving up.
max_error_retries             = 2
# Base backoff between retries, multiplied by 2**retries_used.
error_retry_backoff_sec       = 15
# A heartbeat line on stderr every N seconds: who is in which state, for how long. 0 = off.
progress_every_sec           = 60
# Where the runner is allowed to put scratch files, comma-separated globs.
tmp_roots                    = /tmp/kilo/*, /tmp/contest/*
# Bash commands a policy denies outright, one per session rule, comma-separated.
deny_commands                = git push*, sudo *, rm -rf /*, curl * | sh, wget * | sh
# Bash commands that may write outside the worktree without a path argument
# (redirects, tee, cp/mv/ln/rsync/dd targets, installers). One ask per pattern.
ask_commands                 = *>*, *|*tee *, cp *, mv *, ln *, rsync *, install *, dd *
# The gate's LLM profile: an LlmSettings section name, as [gate1] presence_llm_profile.
gate_llm_profile             = contest_gate_llm
# The OpenRouter agents' own profile, read only when backend = openrouter.
openrouter_llm_profile       = contest_openrouter_llm
# Gate calls per session; the gate is the expensive second model, not the agent.
gate_max_calls_per_session   = 20
# KC-55: a gate call that hits a rate limit or a dropped connection is retried
# (429, 402, 5xx, timeouts, connection errors — never 400/401/403/404).
# The wait is the server's Retry-After on a 429, else gate_retry_wait_sec.
# A Retry-After longer than gate_retry_max_wait_sec is a quota reset: no wait,
# the call fails at once. 0 retries = today's fail-fast gate.
# gate_deadline_sec caps one whole gate decision: every retry and re-ask.
gate_retries                 = 3
gate_retry_wait_sec          = 10
gate_retry_max_wait_sec      = 60
gate_deadline_sec            = 600
# Where a round's output goes.
out_dir                      = contest-out
# Where a round's harvest lands, relative to this file.
rounds_dir                   = ../rounds
# KC-49: the reasoning variant of every agent that names none. `highest` (the
# default) asks each model that lists variants to `say: hello` at intake, from
# the top of the list down, and runs it at the first one that answers; a name
# (`high`, `max`) is sent as is; `default` sends none — the provider's own.
variant                      = highest

# ── the safety gate's model ──────────────────────────────────────────────────
# LlmSettings fields, resolved by tools.auto.llm_profile.resolve_llm_profile:
# base_url / api_key / model are required and never inherited, every other
# field falls back to the gate defaults (response_format = true).
[contest_gate_llm]
base_url        = https://example/v1
api_key         = ${CONTEST_GATE_API_KEY}   ; env reference — the real key goes in contest.local.ini
model           = some/model
api_format      = openai
response_format = true
temperature     = 0.0
max_tokens      = 256

# ── the OpenRouter agents' model ─────────────────────────────────────────────
# Read only when backend = openrouter, resolved the same way as the gate's:
# base_url / api_key / model are required and never inherited. The real key
# goes in contest.local.ini. `model` is deliberately empty — each agent gets
# its own model id from its [contest.agent.<name>] section, not from here.
[contest_openrouter_llm]
base_url        = https://openrouter.ai/api/v1
api_key         = ${CONTEST_OPENROUTER_API_KEY}   ; env reference — the real key goes in contest.local.ini
model           =                                 ; unused: per-agent from the roster
api_format      = openai
response_format = false
temperature     = 0.2
max_tokens      = 4096

# ── the roster ───────────────────────────────────────────────────────────────
# One section per competing model, in the order a round runs them. `model` is
# required; `kilo_agent` and `variant` are optional and empty by default,
# which is the server's own default agent (the probe never sent one).
[contest.agent.laguna]
model      = kenary/laguna-s-2-1:free
kilo_agent =
variant    =

[contest.agent.mistral]
model      = kenary/mistral-medium-3-5:free
kilo_agent =
variant    =

[contest.agent.hy3]
model      = kenary/hy3:free
kilo_agent =
variant    =
